services:
  gateway:
    container_name: emby302gateway
    build: .
    restart: unless-stopped
    stop_grace_period: 20s
    network_mode: host
    environment:
      EMBY_HOST: "http://localhost:8096"
      EMBY_API_KEY: "your_emby_api_key"
      OPENLIST_ADDR: "http://localhost:5244"
      OPENLIST_TOKEN: "your_openlist_token"
      PORT: "18096"
